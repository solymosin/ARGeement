# Tools for the real-genome use case (separate environment to avoid conflicts with argeement):
#   conda env create -f concordance/env.yaml && conda activate argeement-conc
name: argeement-conc
channels: [conda-forge, bioconda]
dependencies:
  - ncbi-datasets-cli
  - ncbi-amrfinderplus
  - rgi
  - resfinder
  - blast
  - unzip
