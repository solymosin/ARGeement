description: >
  <p>Protein-level mapping between the entries of AMRFinderPlus, CARD and ResFinder/DisinFinder,
  with relation types from identical protein to homologue, difference counts, sequence-based family
  clusters and harmonised drug classes, built with the pinned profile
  <code>amrfinder-2026-08-07</code> for samples analysed with AMRFinderPlus database 2026-08-07.1;
  the other databases are pinned to the versions listed below. It is the reference release of the
  version comparison in the ARGeement article. The releases of the default profile, built from the
  latest database versions, are in a separate record (concept DOI
  <a href="https://doi.org/10.5281/zenodo.24278768">10.5281/zenodo.24278768</a>).</p>

keywords: [antimicrobial resistance, resistance gene databases, database harmonisation,
           nomenclature, sequence-based mapping]

