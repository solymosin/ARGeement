title: "ARGeement: sequence-based, versioned mapping of antimicrobial resistance gene databases (pinned profile amrfinder-2026-08-07)"

creators:
  - {name: "Vujić, Vesna", affiliation: "University of Veterinary Medicine Budapest", orcid: "0009-0004-7155-5414"}
